<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyCard - Sua Carteira Digital</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-container">
        <!-- O Cartão Virtual EasyCard -->
        <div class="card theme-dark" id="virtual-card">
            <div class="card-top">
                <h1 class="app-name">EasyCard</h1>
                <img src="img/chip.png" alt="Chip" class="chip">
            </div>
            <div class="card-balance">
                <span class="balance-label">Saldo Disponível</span>
                <p class="balance-amount" id="balance-amount">0,00 MZN</p>
            </div>
            <div class="card-bottom">
                <div class="card-holder">
                    <span class="label">Titular</span>
                    <p id="card-holder-name">NOME DO USUÁRIO</p>
                </div>
                <div class="card-tier">
                    <span class="label">Plano</span>
                    <p id="card-tier-name">PREMIUM BLACK</p>
                </div>
            </div>
        </div>

        <!-- Painel de Controle -->
        <div class="controls">
            <h2>Painel de Controle</h2>
            
            <div class="control-group">
                <label for="deposit-amount">Depositar (via M-Pesa/e-Mola)</label>
                <input type="number" id="deposit-amount" placeholder="Ex: 1600">
                <button id="deposit-btn">Depositar</button>
                <p id="bonus-message" class="bonus-message"></p>
            </div>

            <div class="control-group">
                <label>Escolha um Tema para seu Cartão</label>
                <div class="theme-selector">
                    <button class="theme-btn theme-dark active" data-theme="theme-dark"></button>
                    <button class="theme-btn theme-ocean" data-theme="theme-ocean"></button>
                    <button class="theme-btn theme-sunrise" data-theme="theme-sunrise"></button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
